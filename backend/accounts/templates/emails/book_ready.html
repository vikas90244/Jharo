<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your book is ready — Jharo</title>
</head>

<body style="
  margin:0;
  padding:0;
  background:#f7f3ea;
  color:#292722;
  font-family:Arial,Helvetica,sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#f7f3ea;padding:40px 20px;">

<tr>
<td align="center">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="
         max-width:620px;
         background:#fffdf8;
         border:1px solid #ded7ca;
       ">

<tr>
<td style="padding:32px 40px 20px 40px;">

  <div style="
    font-family:Georgia,'Times New Roman',serif;
    font-size:27px;
    font-weight:bold;
    letter-spacing:-1px;
  ">
    jharo
  </div>

</td>
</tr>

<tr>
<td style="padding:45px 40px 50px 40px;">

  <div style="
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#9a7257;
    margin-bottom:20px;
  ">
    YOUR BOOK IS READY
  </div>

  <h1 style="
    margin:0 0 24px 0;
    font-family:Georgia,'Times New Roman',serif;
    font-size:42px;
    line-height:1.08;
    letter-spacing:-1.5px;
    font-weight:normal;
  ">
    Time to read.
  </h1>

  <p style="
    margin:0 0 18px 0;
    font-size:16px;
    line-height:1.7;
    color:#655e55;
  ">
    We've finished preparing
    <strong style="color:#292722;">
      {{ book_title }}
    </strong>
    for your reading workspace.
  </p>

  <p style="
    margin:0 0 30px 0;
    font-size:16px;
    line-height:1.7;
    color:#655e55;
  ">
    Your book is ready to open, read, highlight,
    and explore.
  </p>

  <table cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td style="background:#302e29;">
        <a href="{{ book_url }}"
           style="
             display:inline-block;
             padding:15px 25px;
             color:#ffffff;
             text-decoration:none;
             font-size:14px;
             font-weight:bold;
           ">
          Open {{ book_title }} →
        </a>
      </td>
    </tr>
  </table>

</td>
</tr>

<tr>
<td style="
  border-top:1px solid #ded7ca;
  padding:22px 40px;
">

  <div style="
    font-family:Georgia,'Times New Roman',serif;
    font-size:16px;
  ">
    jharo
  </div>

  <div style="
    margin-top:7px;
    font-size:12px;
    color:#968c80;
  ">
    Made for readers who think deeply.
  </div>

</td>
</tr>

</table>

</td>
</tr>

</table>

</body>
</html>
