services:
  frontend:
    build: ./frontend
    container_name: jharo_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    
  backend:
    build: ./backend
    container_name: jharo_backend
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
  celery:
    build: ./backend
    container_name: jharo_celery
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
  db:
    image: postgres:18
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
      image: redis:7-alpine
  
volumes:
  postgres_data:
