services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: jharo_frontend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: jharo_backend
    ports:
      - "127.0.0.1:8000:8080"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    container_name: jharo_celery
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - ./backend/.env
    restart: unless-stopped
    depends_on:
      - db
      - redis

  db:
    image: postgres:18
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
  
volumes:
  postgres_data:
