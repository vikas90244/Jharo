# HTTP: allow certificate challenges and redirect everything else to HTTPS
server {
    listen 80;
    server_name jharo.space www.jharo.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: route requests to the appropriate Docker service
server {
    listen 443 ssl;
    server_name jharo.space www.jharo.space;

    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/jharo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jharo.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        set $backend backend:8080;
        proxy_pass http://$backend;

        include /etc/nginx/proxy_params;
    }

    location / {
        set $frontend frontend:3000;
        proxy_pass http://$frontend;

        include /etc/nginx/proxy_params;
    }
}